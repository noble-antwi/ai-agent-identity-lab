<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Card and header -->
  <rect x="0.5" y="0.5" width="959" height="639" rx="16" fill="#FFFFFF" stroke="#D5DEE8"/>
  <path d="M16 0.5 H944 A15.5 15.5 0 0 1 959.5 16 V84 H0.5 V16 A15.5 15.5 0 0 1 16 0.5 Z" fill="#08152F"/>
  <text x="32" y="44" font-size="24" font-weight="700" fill="#FFFFFF">Ask my SIEM</text>
  <text x="32" y="68" font-size="14" fill="#2DD4E8">How one question becomes an answer, without the AI ever touching the lab</text>

  <!-- Zone A: the internet -->
  <rect x="24" y="108" width="250" height="294" rx="14" fill="#F4F6FA" stroke="#C9D3E0" stroke-dasharray="5 4"/>
  <text x="40" y="132" font-size="11" font-weight="700" letter-spacing="1.5" fill="#5B6B85">THE INTERNET</text>
  <rect x="48" y="150" width="202" height="180" rx="12" fill="#FFFFFF" stroke="#1B2F5E" stroke-width="1.5"/>
  <circle cx="149" cy="192" r="26" fill="#E6F4F8"/>
  <path d="M149 175 C150.6 186 154 189.4 165 191 C154 192.6 150.6 196 149 207 C147.4 196 144 192.6 133 191 C144 189.4 147.4 186 149 175 Z" fill="#0E7490"/>
  <text x="149" y="246" font-size="17" font-weight="700" fill="#08152F" text-anchor="middle">Claude</text>
  <text x="149" y="268" font-size="12" fill="#5B6B85" text-anchor="middle">Anthropic API</text>
  <text x="149" y="290" font-size="12" fill="#1B2F5E" text-anchor="middle">reads · decides · writes</text>
  <text x="149" y="310" font-size="12" fill="#1B2F5E" text-anchor="middle">has no tools of its own</text>
  <text x="149" y="372" font-size="12" font-weight="700" fill="#B0422A" text-anchor="middle">Never connects to the lab</text>

  <!-- Zone B: your laptop -->
  <rect x="300" y="108" width="300" height="294" rx="14" fill="#ECF6F9" stroke="#0E7490"/>
  <text x="316" y="132" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0E7490">YOUR LAPTOP</text>
  <rect x="332" y="150" width="236" height="180" rx="12" fill="#FFFFFF" stroke="#0E7490" stroke-width="1.5"/>
  <circle cx="450" cy="192" r="26" fill="#E0F2F7"/>
  <rect x="434" y="180" width="32" height="20" rx="2" fill="none" stroke="#0E7490" stroke-width="2"/>
  <path d="M427 202 H473 L478 208 H422 Z" fill="#0E7490"/>
  <text x="450" y="246" font-size="17" font-weight="700" fill="#08152F" text-anchor="middle" font-family="Consolas, Menlo, monospace">agent.py</text>
  <text x="450" y="268" font-size="12" fill="#1B2F5E" text-anchor="middle">runs the loop and the tools</text>
  <text x="450" y="290" font-size="12" fill="#1B2F5E" text-anchor="middle">.env holds both secrets</text>
  <text x="450" y="310" font-size="12" fill="#5B6B85" text-anchor="middle">(never committed)</text>
  <line x1="450" y1="330" x2="450" y2="350" stroke="#08152F" stroke-width="1.5"/>
  <rect x="370" y="350" width="160" height="34" rx="17" fill="#08152F"/>
  <text x="450" y="372" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">You ask · you read</text>
  <circle cx="428" cy="340" r="9" fill="#0E7490"/><text x="428" y="344" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="472" cy="340" r="9" fill="#0E7490"/><text x="472" y="344" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>

  <!-- Laptop <-> Claude -->
  <line x1="332" y1="210" x2="262" y2="210" stroke="#1B2F5E" stroke-width="2"/>
  <polygon points="250,210 263,204 263,216" fill="#1B2F5E"/>
  <circle cx="279" cy="194" r="10" fill="#0E7490"/><text x="279" y="198" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="303" cy="194" r="10" fill="#0E7490"/><text x="303" y="198" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <line x1="250" y1="270" x2="320" y2="270" stroke="#1B2F5E" stroke-width="2"/>
  <polygon points="332,270 319,264 319,276" fill="#1B2F5E"/>
  <circle cx="279" cy="288" r="10" fill="#0E7490"/><text x="279" y="292" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="303" cy="288" r="10" fill="#0E7490"/><text x="303" y="292" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>

  <!-- Zone C: the lab -->
  <rect x="626" y="108" width="310" height="294" rx="14" fill="#EEF7F3" stroke="#0F6E56"/>
  <text x="642" y="132" font-size="11" font-weight="700" letter-spacing="1.5" fill="#0F6E56">BIIRA BANK LAB · PRIVATE</text>
  <rect x="650" y="150" width="262" height="236" rx="12" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1.5"/>
  <rect x="763" y="170" width="36" height="10" rx="2" fill="#0F6E56"/><circle cx="793" cy="175" r="1.8" fill="#FFFFFF"/>
  <rect x="763" y="183" width="36" height="10" rx="2" fill="#0F6E56"/><circle cx="793" cy="188" r="1.8" fill="#FFFFFF"/>
  <rect x="763" y="196" width="36" height="10" rx="2" fill="#0F6E56"/><circle cx="793" cy="201" r="1.8" fill="#FFFFFF"/>
  <text x="781" y="230" font-size="17" font-weight="700" fill="#08152F" text-anchor="middle">SIEM01</text>
  <text x="781" y="248" font-size="12" fill="#5B6B85" text-anchor="middle">192.168.20.2</text>
  <rect x="666" y="258" width="230" height="36" rx="8" fill="#E3F4EE" stroke="#0F6E56"/>
  <text x="781" y="281" font-size="12" font-weight="700" fill="#0F6E56" text-anchor="middle">Wazuh database · 127.0.0.1:9200</text>
  <rect x="666" y="303" width="230" height="22" rx="6" fill="#CDEFE2" opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.468;0.48;0.6;0.612;1"/></rect>
  <text x="674" y="318" font-size="12" fill="#08152F" font-family="Consolas, Menlo, monospace">wazuh-alerts-*</text>
  <text x="888" y="318" font-size="12" font-weight="700" fill="#0F6E56" text-anchor="end">read ✓</text>
  <line x1="666" y1="328" x2="896" y2="328" stroke="#E1E7EF"/>
  <text x="674" y="346" font-size="12" fill="#08152F" font-family="Consolas, Menlo, monospace">wazuh-archives-*</text>
  <text x="888" y="346" font-size="12" font-weight="700" fill="#B0422A" text-anchor="end">403 ✗</text>
  <text x="781" y="372" font-size="11" fill="#5B6B85" text-anchor="middle">role agent-read-alerts · user svc-ask-siem</text>

  <!-- Laptop <-> lab: the tunnel -->
  <rect x="568" y="230" width="82" height="20" rx="10" fill="#D6EEF4" stroke="#0E7490" stroke-width="1.5"/>
  <line x1="572" y1="240" x2="636" y2="240" stroke="#0E7490" stroke-width="2.5"/>
  <polygon points="648,240 635,234 635,246" fill="#0E7490"/>
  <text x="609" y="222" font-size="11" font-weight="700" fill="#0E7490" text-anchor="middle">SSH tunnel</text>
  <circle cx="597" cy="266" r="10" fill="#0E7490"/><text x="597" y="270" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="621" cy="266" r="10" fill="#0E7490"/><text x="621" y="270" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>


  <!-- Animated step highlights -->
  <rect x="38" y="456" width="436" height="26" rx="13" fill="#D6EEF4" opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.008;0.02;0.1;0.112;1"/></rect>
  <rect x="38" y="488" width="436" height="26" rx="13" fill="#D6EEF4" opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.088;0.1;0.26;0.272;1"/></rect>
